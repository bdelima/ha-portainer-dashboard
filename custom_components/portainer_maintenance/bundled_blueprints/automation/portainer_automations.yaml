alias: "Portainer Maintenance"
blueprint:
  name: "Portainer Maintenance"
  description: >-
    Every live Portainer automation -- notify on update available, handle
    "Update now", handle "Dismiss", offer a stack restart when an update
    needs one, startup recheck for missed updates, notify on container
    trouble, notify on stale devices, keep update.* entities hidden --
    merged into a single automation: multiple triggers, each tagged with
    an id, dispatched via choose/trigger-id branching. One blueprint, one
    automation, instead of one per behavior. Installed automatically by
    the Portainer Maintenance integration -- this file is regenerated on
    every integration load, so don't hand-edit this deployed copy.

    Update-available detection triggers off sensor.portainer_updates_pending
    rather than listening to state_changed system-wide: that sensor's own
    coordinator already scans the entity registry for every update.*
    entity under the Portainer integration every 5 minutes and publishes
    the currently-on ones as its `items` attribute (see sensor.py). This
    automation just diffs that list against its previous value to find
    newly-appeared entries. That keeps "notify about ANY current or future
    update entity" fully automatic with no per-entity selection, while
    only ever listening to one explicit, cheap entity -- a raw
    system-wide state_changed event trigger here previously caused two
    HA lockups (self-retrigger / "Already running" log storms) because it
    fired on every single state change in the house, not just Portainer's.
    Tradeoff: update notifications now follow that sensor's 5-minute
    refresh cadence instead of firing the instant an update.* entity
    flips -- same cadence the old template-sensor design already used, so
    not a regression.

    Tradeoff accepted by merging: no more independent enable/disable or
    separate trace/history per behavior in the HA UI -- disabling just one
    (e.g. stale-device alerts) means editing this automation's choose
    block, not flipping a toggle, and HA's trace view shows one shared run
    history rather than six. See the design doc's "Blueprints" section.
  domain: automation
  input:
    notify_device:
      name: Notify device(s)
      description: >-
        The mobile_app device(s) all Portainer notifications go to. Select
        more than one to push to multiple phones/tablets.
      selector:
        device:
          filter:
            integration: mobile_app
          multiple: true

trigger:
  - id: update_available
    trigger: state
    entity_id: sensor.portainer_updates_pending
  - id: notification_action
    trigger: event
    event_type: mobile_app_notification_action
  - id: startup_recheck
    trigger: homeassistant
    event: start
  - id: container_trouble
    trigger: state
    entity_id: sensor.portainer_container_trouble
  - id: stale_devices
    trigger: state
    entity_id: sensor.portainer_stale_devices
  - id: entity_registry_updated
    trigger: event
    event_type: entity_registry_updated

action:
  - variables:
      notify_devices: !input notify_device
      notify_services: "{{ notify_devices | map('device_attr', 'name') | map('slugify') | map('regex_replace', '^', 'notify.mobile_app_') | list }}"
  - choose:
      # 1. Notify on newly-appeared update-available entries
      #    (diffs sensor.portainer_updates_pending's `items` list --
      #    see the blueprint description for why this isn't a raw
      #    state_changed listener.)
      - conditions:
          - condition: trigger
            id: update_available
        sequence:
          - variables:
              old_items: "{{ trigger.from_state.attributes.get('items', []) if trigger.from_state else [] }}"
              new_items: "{{ trigger.to_state.attributes.get('items', []) if trigger.to_state else [] }}"
              old_entities: "{{ old_items | map(attribute='entity') | list }}"
              newly_appeared: "{{ new_items | rejectattr('entity', 'in', old_entities) | list }}"
          - repeat:
              for_each: "{{ newly_appeared }}"
              sequence:
                - variables:
                    new_item: "{{ repeat.item }}"
                - repeat:
                    for_each: "{{ notify_services }}"
                    sequence:
                      - action: "{{ repeat.item }}"
                        data:
                          title: "Update available"
                          message: "{{ new_item.name }}"
                          data:
                            tag: "{{ new_item.entity }}"
                            actions:
                              - action: "EXECUTE_UPDATE_{{ new_item.entity }}"
                                title: "Update now"
                              - action: "DISMISS_UPDATE_{{ new_item.entity }}"
                                title: "Dismiss"

      # 2. Handle "Update now"
      - conditions:
          - condition: trigger
            id: notification_action
          - condition: template
            value_template: "{{ trigger.event.data.action.startswith('EXECUTE_UPDATE_') }}"
        sequence:
          - action: portainer_maintenance.perform_update
            data:
              update_entity: "{{ trigger.event.data.action.replace('EXECUTE_UPDATE_', '') }}"

      # 3. Handle "Dismiss"
      - conditions:
          - condition: trigger
            id: notification_action
          - condition: template
            value_template: "{{ trigger.event.data.action.startswith('DISMISS_UPDATE_') }}"
        sequence:
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    message: "clear_notification"
                    data:
                      tag: "{{ trigger.event.data.action.replace('DISMISS_UPDATE_', '') }}"

      # 4. Handle "Restart Stack Now" -- offered only when perform_update hit
      #    the confirmed, unfixed Portainer bug where recreating a single
      #    container on network_mode: service:X/container:X (a VPN sidecar
      #    like gluetun) fails at the Docker daemon level over a
      #    hostname/network_mode conflict. The pull+recreate itself still
      #    completes, but the image tag only reconciles once the owning
      #    stack is restarted -- see __init__.py's module docstring (1c.)
      #    for the full story. Deliberately a tap, not automatic: a stack
      #    restart bounces every other container in it too.
      - conditions:
          - condition: trigger
            id: notification_action
          - condition: template
            value_template: "{{ trigger.event.data.action.startswith('RESTART_STACK_') }}"
        sequence:
          - action: portainer_maintenance.restart_stack
            data:
              switch_entity_id: "{{ trigger.event.data.action.replace('RESTART_STACK_', '') }}"

      # 5. Startup recheck for missed updates
      - conditions:
          - condition: trigger
            id: startup_recheck
        sequence:
          - wait_template: >
              {{ integration_entities('portainer') | select('match', 'update\\.') | map('states') | reject('in', ['unknown','unavailable']) | list | length > 0 }}
            timeout: "00:05:00"
            continue_on_timeout: true
          - delay:
              seconds: 30
          # Hide any Portainer update.* entity that isn't hidden yet --
          # covers anything that existed before this feature shipped, or
          # slipped through some other way. Ongoing coverage for entities
          # created *after* startup is branch 8, below.
          - action: portainer_maintenance.hide_update_entities
          # Force our own coordinator to re-scan right now -- its own
          # first-refresh-at-startup can land before the portainer
          # integration's update.* entities are actually populated
          # (manifest.json's dependency only guarantees setup ORDER, not
          # that those entities have real states yet), which would
          # otherwise leave this sensor stuck reporting 0 until its next
          # 5-minute poll.
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.portainer_updates_pending
          - condition: template
            value_template: "{{ states('sensor.portainer_updates_pending') | int(0) > 0 }}"
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "Updates available (recheck)"
                    message: >
                      {{ states('sensor.portainer_updates_pending') }} pending update{{ 's' if states('sensor.portainer_updates_pending') | int != 1 else '' }} found at startup. Tap to review.
                    data:
                      tag: "portainer_updates_pending"
                      clickAction: "{{ states('sensor.portainer_actions_url') }}"
                      url: "{{ states('sensor.portainer_actions_url') }}"

      # 6. Notify on container trouble
      - conditions:
          - condition: trigger
            id: container_trouble
          - condition: template
            value_template: >
              {{ trigger.to_state.state | int(0) > (trigger.from_state.state | int(0) if trigger.from_state else 0) }}
        sequence:
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "Container trouble"
                    message: >
                      {{ trigger.to_state.state }} container{{ 's' if trigger.to_state.state | int != 1 else '' }} need attention. Tap to review.
                    data:
                      tag: "portainer_container_trouble"
                      priority: high
                      ttl: 0
                      channel: alarm_stream
                      clickAction: "{{ states('sensor.portainer_actions_url') }}"
                      url: "{{ states('sensor.portainer_actions_url') }}"

      # 7. Report stale Portainer devices
      - conditions:
          - condition: trigger
            id: stale_devices
          - condition: template
            value_template: >
              {{ trigger.to_state.state | int(0) > (trigger.from_state.state | int(0) if trigger.from_state else 0) }}
        sequence:
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "Stale Portainer devices"
                    message: >
                      {{ trigger.to_state.state }} device{{ 's' if trigger.to_state.state | int != 1 else '' }} look gone. Tap to review.
                    data:
                      tag: "portainer_stale_devices"
                      clickAction: "{{ states('sensor.portainer_actions_url') }}"
                      url: "{{ states('sensor.portainer_actions_url') }}"

      # 8. Hide a newly-registered update entity
      #    Ongoing counterpart to branch 5's startup sweep -- fires the
      #    moment a new container's update.* entity is registered (rather
      #    than waiting for the next HA restart), so a container added at
      #    any time gets its update entity hidden automatically. Filters
      #    entity_registry_updated (which fires for every entity in the
      #    house, any integration) down to just a newly-created update.*
      #    entity belonging to the portainer platform, via the same
      #    config_entry_id()/config_entry_attr() dynamic-scoping pattern
      #    used everywhere else in this design. Re-scans everything rather
      #    than hiding just the one entity -- cheap, and self-healing
      #    against anything else that slipped through.
      - conditions:
          - condition: trigger
            id: entity_registry_updated
          - condition: template
            value_template: >
              {{ trigger.event.data.action == 'create'
                 and trigger.event.data.entity_id.startswith('update.')
                 and config_entry_attr(config_entry_id(trigger.event.data.entity_id), 'domain') == 'portainer' }}
        sequence:
          - action: portainer_maintenance.hide_update_entities

  # 9. Sidebar notification-bell badge: HA's own persistent_notification
  # count (the bell icon, top of the sidebar) is native and needs no
  # third-party plugin, unlike a badge on the panel item itself, which
  # HA's frontend doesn't expose to custom integrations at all. Recomputed
  # after every run regardless of which trigger fired -- cheap (three
  # state reads, one service call) and keeps this always correct off the
  # sensors' current values rather than needing to track deltas per
  # branch above.
  - variables:
      total_action_items: >-
        {{ (states('sensor.portainer_updates_pending') | int(0))
           + (states('sensor.portainer_container_trouble') | int(0))
           + (states('sensor.portainer_stale_devices') | int(0)) }}
  - if:
      - condition: template
        value_template: "{{ total_action_items > 0 }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: portainer_maintenance_action_items
          title: "Portainer Maintenance"
          message: |-
            {%- set updates_n = states('sensor.portainer_updates_pending') | int(0) -%}
            {%- set stale_n = states('sensor.portainer_stale_devices') | int(0) -%}
            {%- set trouble_n = states('sensor.portainer_container_trouble') | int(0) -%}
            {%- set parts = [] -%}
            {%- if updates_n > 0 -%}{%- set parts = parts + [updates_n ~ ' image update' ~ ('s' if updates_n != 1 else '')] -%}{%- endif -%}
            {%- if stale_n > 0 -%}{%- set parts = parts + [stale_n ~ ' stale device' ~ ('s' if stale_n != 1 else '')] -%}{%- endif -%}
            {%- if trouble_n > 0 -%}{%- set parts = parts + [trouble_n ~ ' container' ~ ('s' if trouble_n != 1 else '') ~ ' in trouble'] -%}{%- endif -%}
            {%- set summary = parts[0] if parts | length == 1 else (parts[0] ~ ' and ' ~ parts[1]) if parts | length == 2 else (parts[:-1] | join(', ') ~ ', and ' ~ parts[-1]) -%}
            Portainer is reporting {{ summary }}. [Open dashboard](/portainer-actions) to review.
    else:
      - action: persistent_notification.dismiss
        data:
          notification_id: portainer_maintenance_action_items
