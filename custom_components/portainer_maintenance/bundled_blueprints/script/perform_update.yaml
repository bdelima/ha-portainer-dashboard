alias: "Portainer Perform Update"
blueprint:
  name: "Portainer Perform Update"
  description: >-
    The single entry point that actually does an update: recreates the
    container with a fresh image pull, clears any lingering phone
    notification for it, then hands off to the confirmation script.
    Automation 2's branch (live "Update now" tap) and the webapp's
    install/batch-install actions all call this directly with just an
    update_entity. Installed automatically by the Portainer Maintenance
    integration -- this file is regenerated on every integration load, so
    don't hand-edit this deployed copy.

    IMPORTANT after creating this from the blueprint: HA assigns this
    script's entity_id from whatever name you give it at creation, not
    automatically "portainer_perform_update" -- go to this script's
    settings (cog icon) and set its Entity ID explicitly to
    "portainer_perform_update", since the merged automation, the webapp's
    backend, and this design's docs all call it by that exact name.
  domain: script
  input:
    notify_device:
      name: Notify device(s)
      description: >-
        The mobile_app device(s) this clears notifications on. Select more
        than one to clear the notification on multiple phones/tablets.
      selector:
        device:
          filter:
            integration: mobile_app
          multiple: true

fields:
  update_entity:
    name: Update entity
    description: The update.* entity to install.
    required: true
    example: "update.plex_update"
    selector:
      entity:
        domain: update

sequence:
  - variables:
      notify_devices: !input notify_device
      notify_services: "{{ notify_devices | map('device_attr', 'name') | map('slugify') | map('regex_replace', '^', 'notify.mobile_app_') | list }}"
      container_device_id: "{{ device_id(update_entity) }}"
      host_name: >
        {% set walk = namespace(current=container_device_id) %}
        {% for _ in range(4) %}
          {% set parent = device_attr(walk.current, 'via_device_id') %}
          {% if parent %}
            {% set walk.current = parent %}
          {% endif %}
        {% endfor %}
        {{ device_attr(walk.current, 'name') }}
      device_name: "{{ state_attr(update_entity, 'friendly_name') }} ({{ host_name }})"
  - action: portainer.recreate_container
    data:
      container_device_id: "{{ container_device_id }}"
      pull_image: true
  - repeat:
      for_each: "{{ notify_services }}"
      sequence:
        - action: "{{ repeat.item }}"
          data:
            message: "clear_notification"
            data:
              tag: "{{ update_entity }}"
  - action: script.portainer_update_done
    data:
      device_name: "{{ device_name }}"
      update_entity: "{{ update_entity }}"
