blueprint:
  name: "Portainer Maintenance: update done"
  description: >-
    Shared finishing logic -- posts the "Update performed" confirmation
    (both a persistent_notification and a real phone push). Called only by
    script.portainer_perform_update. Installed automatically by the
    Portainer Maintenance integration -- this file is regenerated on every
    integration load, so don't hand-edit this deployed copy.

    IMPORTANT after creating this from the blueprint: set this script's
    Entity ID explicitly to "portainer_update_done" via its settings (cog
    icon) -- script.portainer_perform_update calls it by that exact name,
    and HA does not assign it automatically from the blueprint.
  domain: script
  input:
    notify_device:
      name: Notify device
      description: The mobile_app device to push the "update performed" confirmation to.
      selector:
        device:
          filter:
            integration: mobile_app

fields:
  device_name:
    name: Device name
    description: Display name for the confirmation message.
    required: true
    example: "Plex"
    selector:
      text:
  update_entity:
    name: Update entity
    description: The update.* entity that was just installed.
    required: true
    example: "update.plex_update"
    selector:
      entity:
        domain: update

sequence:
  - variables:
      notify_device: !input notify_device
      notify_service: "{{ 'notify.mobile_app_' ~ device_attr(notify_device, 'name') | slugify }}"
  - action: persistent_notification.dismiss
    data:
      notification_id: "portainer_update_{{ update_entity | replace('.', '_') }}"
  - action: persistent_notification.create
    data:
      notification_id: "portainer_update_{{ update_entity | replace('.', '_') }}"
      title: "Update performed: {{ device_name }}"
      message: "Updated on {{ now().strftime('%Y-%m-%d %H:%M') }}"
  - action: "{{ notify_service }}"
    data:
      title: "Update performed"
      message: "{{ device_name }} updated on {{ now().strftime('%Y-%m-%d %H:%M') }}."
      data:
        tag: "portainer_update_done_{{ update_entity | replace('.', '_') }}"
