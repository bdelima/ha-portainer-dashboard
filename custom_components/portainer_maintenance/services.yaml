remove_device:
  name: Remove device
  description: >-
    Removes a device from the device registry. Used to clean up stale
    Portainer devices/stacks that Portainer's own HA integration doesn't
    clean up on its own (a confirmed open bug: home-assistant/core#155548).
    This deletes the device outright -- there is no undo. Intended for
    devices already confirmed stale (all entities unavailable for 12+ hours
    while the host endpoint is healthy), not general-purpose device removal.
  fields:
    device_id:
      name: Device
      description: The device_id to remove (not an entity_id).
      required: true
      example: "3f9e1c2b4a5d6e7f8091a2b3c4d5e6f7"
      selector:
        text:

prune_images:
  name: Prune images
  description: >-
    Reclaims disk space by pruning Docker images across every Portainer
    endpoint (host) this HA instance knows about -- discovered
    automatically from the device registry, same as the tracking sensors,
    so a newly-added host needs no extra configuration here. Wraps the
    core portainer.prune_images action, called once per discovered host.
  fields:
    dangling:
      name: Dangling only
      description: >-
        Only remove untagged orphan layers (leftovers from rebuilding a
        locally-built image with the same tag) -- these are never
        referenced by any container, running or stopped, so this is safe
        to run anytime with no time buffer. When false, also removes
        tagged images with zero referencing containers (e.g. left behind
        by a deleted Portainer stack), subject to until_hours below.
      required: false
      default: false
      selector:
        boolean:
    until_hours:
      name: Unused for at least (hours)
      description: >-
        Only applies when dangling is false. Skips a tagged-but-unused
        image until it's been unused for at least this many hours, so a
        stack you stop and restart shortly after keeps its cached image
        instead of losing it to a prune run in between. Leave blank to
        prune all unused images immediately regardless of age.
      required: false
      example: 48
      selector:
        number:
          min: 1
          max: 8760
          mode: box
    device_ids:
      name: Endpoints (optional)
      description: >-
        Limit this run to specific endpoint device(s) instead of every
        discovered host -- used by the webapp's Cleanup tab, where a
        single tree row targets one host. Leave blank to prune every
        discovered Portainer endpoint, same as before this field existed.
      required: false
      selector:
        device:
          integration: portainer
          model: Endpoint
          multiple: true

prune_volumes:
  name: Prune volumes
  description: >-
    Reclaims disk space by pruning unused Docker volumes, across every
    discovered Portainer endpoint or specific one(s) via device_ids.
    Core's portainer integration has no dedicated service for this --
    only a button.*_volumes_prune entity per endpoint (the same action
    Portainer's own "Prune unused volumes" button performs) -- so this
    wraps that button via the standard button.press service instead of
    duplicating core's own pruning logic. Offered as a courtesy on the
    Cleanup tab: core's own volume entities give limited visibility into
    what's actually unused, so treat this as "the same button Portainer's
    UI has," not a more informed decision than pressing it there yourself.
  fields:
    device_ids:
      name: Endpoints (optional)
      description: >-
        Limit this run to specific endpoint device(s) instead of every
        discovered host. Leave blank to prune volumes on every discovered
        Portainer endpoint.
      required: false
      selector:
        device:
          integration: portainer
          model: Endpoint
          multiple: true

reload_endpoint:
  name: Reload endpoint
  description: >-
    Reloads the core portainer config entry that owns the given endpoint
    device -- the same reload Settings -> Devices & Services -> Portainer
    -> Reload performs from the UI. Core's own integration silently drops
    an endpoint from its data the moment it can't reach it, with no error
    and no dedicated "endpoint unavailable" entity of its own; this is the
    remediation the dashboard's Trouble tab offers for that case.
  fields:
    device_id:
      name: Endpoint
      description: The endpoint device_id to reload.
      required: true
      selector:
        device:
          integration: portainer
          model: Endpoint

perform_update:
  name: Perform update
  description: >-
    Recreates/pulls the container behind a pending update.* entity via the
    core portainer.recreate_container action, then either posts an
    "update complete" confirmation (matching update_done below) or, if the
    recreate itself fails the way Portainer does for containers sharing
    another container's network (network_mode: service:<other>/container:<other>
    -- a confirmed, unfixed Portainer/Docker daemon conflict, not a bug in
    this integration: see github.com/orgs/portainer/discussions/12389),
    notifies that the owning stack needs a manual restart to finish cleanly
    instead. That specific case is told apart from a genuine failure by
    watching what actually happens to the container's own image reference
    over the following couple of minutes, not by matching the error's text
    (confirmed in production that HA core wraps every recreate failure into
    the same generic error, so the real Docker/Portainer text never reaches
    this integration) -- which means a call against a container that's part
    of a stack can take up to ~2.5 minutes to return on a genuine failure,
    typically much faster otherwise. Called by the bundled automation
    blueprint's "Update now" notification action and by the companion
    ha-portainer-sidecar webapp; safe to call directly from a script or
    Developer Tools too. Returns {needs_stack_restart, stack_switch_entity_id}
    via HA's action-response-data feature (call with "Response variable"
    set, or `?return_response` over the REST API) so a caller can react to
    the stack-restart case immediately instead of only via the phone push.
  fields:
    update_entity:
      name: Update entity
      description: The update.* entity to recreate the container for.
      required: true
      example: update.dozzle_agent_image_update
      selector:
        entity:
          domain: update

update_done:
  name: Update done
  description: >-
    Posts the same "update complete" confirmation perform_update sends on
    success, without doing any recreate itself. For a caller that already
    performed the update through some other path (e.g. Portainer's own UI)
    and just wants this integration's tracking/notification state to
    reflect it. Most setups never need to call this directly -- it's what
    perform_update calls internally on a successful recreate.
  fields:
    device_name:
      name: Device name
      description: The friendly container/device name to show in the confirmation.
      required: true
      example: dozzle-agent
      selector:
        text:
    update_entity:
      name: Update entity
      description: The update.* entity that was updated.
      required: true
      example: update.dozzle_agent_image_update
      selector:
        entity:
          domain: update

restart_stack:
  name: Restart stack
  description: >-
    Stops then starts every container in a Portainer stack, via that
    stack's own switch.* entity (a stop, a settle pause, then a start --
    not the core switch's toggle, since Docker needs a moment between the
    two). Bounces every container in the stack, not just the one that
    needed it, so this isn't run automatically after every update --
    only offered when perform_update detects the network_mode:service
    daemon conflict described above. Safe to call anytime you want a full
    stack recycle, not just after that prompt.
  fields:
    switch_entity_id:
      name: Stack switch
      description: The switch.* entity for the Portainer stack to restart.
      required: true
      example: switch.media_stack
      selector:
        entity:
          domain: switch

hide_update_entities:
  name: Hide update entities
  description: >-
    Scans every Portainer update.* entity and hides any that aren't
    already hidden (entity_registry hidden_by). Closes a manual
    per-new-container setup step -- a newly-added container's update
    entity used to have to be found and hidden by hand to avoid update
    badge clutter in the Settings UI, since its actual pending/not state
    is meant to be reviewed on the dashboard instead. Called
    automatically by the bundled automation blueprint at HA startup and
    whenever a new entity is registered; safe to call directly too.
    Re-hides an entity a user manually un-hid on the next run --
    intentional, not a bug: this system's design goal is that these
    entities' state belongs on the dashboard, not HA's own entity list.
    Takes no fields; always scans every Portainer update.* entity.
